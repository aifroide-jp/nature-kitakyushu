  - id: about_spots_auma
    title: 合馬竹林公園 | アーバンネイチャー北九州
    file: about/spots/auma.html
    sections:
      - id: header
        fields:
          - element: img
            field_name: header_image
            tab: section
            type: image
            default: ../../images/2026/02/logo.png
      - id: spot_hero
        fields:
          - element: img
            field_name: spot_hero_image
            tab: main
            type: image
            default: ../../images/2025/03/b-2.jpg
          - element: h1
            field_name: spot_hero_title
            tab: main
            type: text
            default: 合馬竹林公園
          - element: p
            field_name: spot_hero_text
            tab: main
            type: textarea
            default: 日本一のたけのこ産地に広がる、150種以上の竹・笹が集う竹の博物館
      - id: section_white
        fields:
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: 見どころ・体験できること
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              「合馬のたけのこ」は全国にその名を知られる逸品。その産地の里山に整備された竹の見本園には、国産・中国産など150種類以上の竹・笹が集められています。亀甲模様の「キッコウチク」や節間が膨らむ「ラッキョウヤダケ」など、ユニークな品種を間近で観察できます。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              展示館ではエジソンが電球のフィラメントに使ったという竹製品など、竹と人の関わりを学べる展示も充実。毎年3〜5月はたけのこ収穫体験も開催され、掘りたてのたけのこを味わえます。入場無料で、家族連れのハイキングにも最適です。
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 地図・場所
