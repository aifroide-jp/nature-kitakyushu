          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 2. 収集する情報
          - element: p
            field_name: section_white_text_4
            tab: section
            type: textarea
            default: 当サイトでは、以下の情報を収集する場合があります。
