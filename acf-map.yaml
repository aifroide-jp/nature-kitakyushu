            default: ソラランド平尾台は、日本三大カルストの一つである平尾台に位置する自然体験公園です。石灰岩が織りなす独特の地形と、その上に広がる草原の風景は圧巻です。
          - element: p
            field_name: section_gray_text_2
            tab: section
            type: textarea
            default: >-
              園内にはビジターセンター「ほしがめ」があり、平尾台の自然や地質についての展示・解説を行っています。周辺には鍾乳洞（千仏鍾乳洞、目白鍾乳洞など）や、ハイキングコースが整備されており、四季を通じて自然体験を楽しめます。
          - element: p
            field_name: section_gray_text_3
            tab: section
            type: textarea
            default: >-
              春には野焼きが行われ、夏には草原に多くの野草が咲き誇ります。秋にはススキの原が広がり、冬には澄んだ空気の中で遠くの山々を望むことができます。カルスト台地ならではの地学的な学びも魅力の一つです。
