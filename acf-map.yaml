          - element: h2
            field_name: section_white_title_5
            tab: section
            type: text
            default: 5. 安全管理措置
          - element: p
            field_name: section_white_text_7
            tab: section
            type: textarea
            default: 当サイトは、個人情報の漏洩、滅失または毀損を防止するため、適切な安全管理措置を講じます。また、個人情報を取り扱う職員に対して、適切な監督を行います。
          - element: h2
            field_name: section_white_title_6
            tab: section
            type: text
            default: 6. Cookieについて
          - element: p
            field_name: section_white_text_8
            tab: section
            type: textarea
            default: 当サイトでは、利便性の向上やアクセス解析のためにCookie（クッキー）を使用する場合があります。Cookieの使用により個人を特定する情報を収集することはありません。
          - element: p
            field_name: section_white_text_9
            tab: section
            type: textarea
            default: ブラウザの設定により、Cookieの受け入れを拒否することが可能です。ただし、その場合、当サイトの一部の機能が正常に動作しない場合があります。
