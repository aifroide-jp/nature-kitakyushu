  - id: network_hibikinadabiotope
    title: 響灘ビオトープ共同事業体 | アーバンネイチャー北九州
    file: network/hibikinadabiotope.html
    sections:
      - id: page_header
        fields:
          - element: h1
            field_name: page_header_title
            tab: section
            type: text
            default: 響灘ビオトープ共同事業体
          - element: p
            field_name: page_header_text
            tab: section
            type: textarea
            default: 廃棄物処分場跡地から生まれた、日本最大級の自然再生拠点
      - id: section_white
        fields:
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: 廃棄物処分場が、日本最大級の自然再生拠点へ。
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              響灘ビオトープ共同事業体は、北九州市若松区に位置する日本最大級のビオトープ（約41ha）を運営する団体です。かつての廃棄物処分場跡地に、湿地・草原・淡水池など多様な環境を創出し、絶滅危惧種を含む多くの野生生物が生息する自然再生のモデルケースとして、国内外から注目を集めています。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: 「都市と自然との共生するまち」をビジョンに掲げ、工業都市・北九州の環境回復の歴史を体現する場として、市民・企業・行政が連携したネイチャーポジティブな取り組みを続けています。
          - element: img
            field_name: section_white_image_1
            tab: section
            type: image
            default: ../images/2025/03/b-2-1-450x450.jpg
          - element: img
            field_name: section_white_image_2
            tab: section
            type: image
            default: ../images/2025/04/チュウヒ-450x450.jpg
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 活動内容
          - element: p
            field_name: section_white_text_3
            tab: section
            type: textarea
            default: 生物多様性の保全・回復と、市民・企業をつなぐ環境学習を両輪で進める
          - element: h3
            field_name: section_white_title_3
            tab: section
            type: text
            default: 生物多様性に配慮した環境整備
          - element: p
            field_name: section_white_text_4
            tab: section
            type: textarea
            default: 希少種の生息環境を維持するための湿地管理・外来種対策・再生可能エネルギー導入など、生態系に配慮した施設運営を実施。
          - element: h3
            field_name: section_white_title_4
            tab: section
            type: text
            default: 野鳥観察会「鳥観んぐ」
          - element: p
            field_name: section_white_text_5
            tab: section
            type: textarea
            default: ガイド付きの野鳥観察会を定期開催。渡り鳥の十字路・北九州に飛来する多様な鳥類を間近で観察できる市民向けプログラム。
          - element: h3
            field_name: section_white_title_5
            tab: section
            type: text
            default: フォトミッション・環境学習
          - element: p
            field_name: section_white_text_6
            tab: section
            type: textarea
            default: 季節ごとの生きもの写真撮影イベントや、学校・企業向け環境学習プログラムを提供。生物多様性を「体験」から理解する機会をつくる。
          - element: h3
            field_name: section_white_title_6
            tab: section
            type: text
            default: OECM・ネイチャーポジティブ経営支援
          - element: p
            field_name: section_white_text_7
            tab: section
            type: textarea
            default: 福岡県内初のOECM登録拠点として、企業のネイチャーポジティブ経営・TNFDへの対応を支援。自然資本を活かしたビジネス連携の場を提供。
          - element: h2
            field_name: section_white_title_7
            tab: section
            type: text
            default: 施設情報・アクセス
      - id: section_gray
        fields:
          - element: h2
            field_name: section_gray_title_1
            tab: section
            type: text
            default: 響灘ビオトープ 3つの特徴
          - element: h2
            field_name: section_gray_title_2
            tab: section
            type: text
            default: アーバンネイチャー北九州との関係
          - element: p
            field_name: section_gray_text_1
            tab: section
            type: textarea
            default: 響灘ビオトープ共同事業体は、北九州ネイチャーポジティブ北九州ネットワークの会員団体として、アーバンネイチャー北九州の取り組みを現場で体現する中核的拠点のひとつです。
          - element: p
            field_name: section_gray_text_2
            tab: section
            type: textarea
            default: >-
              かつての工業廃棄物処分場が日本最大級の自然再生拠点に生まれ変わった歴史は、「工業都市でありながら豊かな自然が近接する」という北九州のアーバンネイチャーを象徴するストーリーでもあります。企業・市民・行政が一体となって自然を守り育てるこの拠点は、ネイチャーポジティブのグローバルモデルとしての発信拠点にもなっています。
          - element: p
            field_name: section_gray_text_3
            tab: section
            type: textarea
            default: >-
              人・動植物・環境の健康を一体的に守る「One
              Health」の理念のもと、生物多様性保全・自然とのふれあい機会提供・再生可能エネルギー導入など複合的な取り組みが福岡県に認定されています。
      - id: cta_band
        fields:
          - element: h2
            field_name: cta_band_title
            tab: section
            type: text
            default: ネイチャーポジティブの取り組みに参加しませんか
      - id: footer
        fields:
          - element: p
            field_name: footer_text
            tab: section
            type: textarea
            default: 都市と自然が近接する北九州の強みを活かし、市民・企業・行政が一体となってネイチャーポジティブの実現を目指すプラットフォームです。
          - element: h3
            field_name: footer_title_1
