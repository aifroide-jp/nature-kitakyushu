            default: 集合場所：平尾台　平尾台自然の郷 駐車場（北九州市小倉南区平尾台1丁目）
          - element: svg
            field_name: section_white_icon_2
            tab: section
            type: image
            default: <inline-svg>
          - element: p
            field_name: section_white_text_6
            tab: section
            type: textarea
            default: 〒803-0180北九州市小倉南区平尾台1丁目平尾台自然の郷TEL：093-685-1013
          - element: svg
            field_name: section_white_icon_3
            tab: section
            type: image
            default: <inline-svg>
          - element: p
            field_name: section_white_text_7
            tab: section
            type: textarea
            default: |-
