          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              昼間は多様な植生のなかを歩くハイキングコースが整備されており、野鳥や草花の観察も楽しめます。山頂には展望台レストランもあり、景色を眺めながら食事ができます。乗り物での山頂アクセスができるため、小さな子どもや年配の方にも安心です。
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 地図・場所
