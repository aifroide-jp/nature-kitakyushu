  - id: events_hiraodai_kansatsukai
    title: 平尾台 春の自然観察会 〜カルスト台地の野草を楽しむ〜 | アーバンネイチャー北九州
    file: events/hiraodai-kansatsukai.html
    sections:
      - id: ev_hero
        fields:
          - element: img
            field_name: ev_hero_image
            tab: main
            type: image
            default: ../images/2026/04/平尾台シャボン玉-1-450x450.jpg
          - element: h1
            field_name: ev_hero_title
            tab: main
            type: text
            default: 平尾台 春の自然観察会〜カルスト台地の野草を楽しむ〜
          - element: svg
            field_name: ev_hero_icon
            tab: section
            type: image
            default: <inline-svg>
      - id: section_white
        fields:
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: イベント内容
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              春の平尾台は、カルスト台地ならではの野草が一斉に咲き競う季節です。石灰岩の隙間にしか生えない希少な植物、野焼き後の新緑の草原に広がる花々——普段は見落としがちな足元の自然を、専門ガイドと一緒にじっくり観察します。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              「草花の名前をもっと知りたい」「子どもに自然を好きになってほしい」という方にぴったりの、ゆったりペースのウォーキング観察会です。観察した野草はその場でスケッチしたり、名前を調べたりしながら楽しめます。歩く距離は約3km。小学生以上のお子様も無理なく参加いただけます。
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: タイムスケジュール
          - element: h2
            field_name: section_white_title_3
            tab: section
            type: text
            default: 注意事項
          - element: p
            field_name: section_white_text_3
            tab: section
            type: textarea
            default: 小雨の場合は決行します。荒天（雷・強風・大雨）の場合は中止とし、前日17:00までに公式SNSおよびお申し込みメールアドレスへご連絡します。
          - element: p
            field_name: section_white_text_4
            tab: section
            type: textarea
            default: |-
              ・歩きやすいシューズ（スニーカー可、サンダル不可）
                            ・飲み物・軽食（コース途中に自動販売機なし）
                            ・帽子・虫よけ・日焼け止め
                            ・メモ帳・スケッチブック（任意）
                            ・動植物の採取はご遠慮ください
          - element: svg
            field_name: section_white_icon_1
            tab: section
            type: image
            default: <inline-svg>
          - element: h2
            field_name: section_white_title_4
            tab: section
            type: text
            default: 会場・アクセス
