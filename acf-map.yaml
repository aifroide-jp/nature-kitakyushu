  - id: events_sample
    title: 平尾台シャボン玉フェスティバル | アーバンネイチャー北九州
    file: events/sample.html
    sections:
      - id: ev_hero
        fields:
          - element: img
            field_name: ev_hero_image
            tab: main
            type: image
            default: ../images/2026/04/hiraodai.jpg
          - element: h1
            field_name: ev_hero_title
            tab: main
            type: text
            default: 平尾台シャボン玉フェスティバル
          - element: svg
            field_name: ev_hero_icon
            tab: section
            type: image
            default: <inline-svg>
      - id: section_white
        fields:
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: イベント内容
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              九州最大のカルスト台地・平尾台の広大な草原を舞台に、色とりどりのシャボン玉が空を彩る1日限りのフェスティバルを開催します。大きなシャボン玉をつくるワークショップや、子どもたちが自由に走り回れる芝生広場での遊びコーナーなど、家族みんなで楽しめるプログラムを用意しています。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              「自然のなかで思いきり遊ぶ」をテーマに、カルスト地形の解説ガイドウォークも同時開催。石灰岩の羊群原を歩きながら、普段は気づかない平尾台の生き物や地形の不思議を学べます。小さなお子さんから大人まで、自然の楽しさを全身で感じられる1日です。
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: タイムスケジュール
          - element: h2
            field_name: section_white_title_3
            tab: section
            type: text
            default: 注意事項
          - element: p
            field_name: section_white_text_3
            tab: section
            type: textarea
            default: >-
              小雨の場合は決行します。荒天（強風・雷・大雨）の場合は中止とし、前日18:00までに公式サイトおよびSNSでお知らせします。中止の場合のご返金はありません（参加費無料のため）。
          - element: p
            field_name: section_white_text_4
            tab: section
            type: textarea
            default: |-
              ・動きやすい服装・歩きやすい靴でお越しください。
                            ・虫よけ・日焼け止めをご持参ください。
                            ・ゴミは各自お持ち帰りください（ゴミ箱設置なし）。
                            ・ペットの同伴はご遠慮ください。
          - element: svg
            field_name: section_white_icon_1
            tab: section
            type: image
            default: <inline-svg>
          - element: h2
