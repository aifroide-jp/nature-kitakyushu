  - id: network_cases_mine
    title: 株式会社マイン | 実践事例 | アーバンネイチャー北九州
    file: network/cases/mine.html
    sections:
      - id: header
        fields:
          - element: img
            field_name: header_image
            tab: section
            type: image
            default: ../../images/2026/02/logo.png
      - id: main_content
        fields:
          - element: h1
            field_name: main_content_title
            tab: main
            type: text
            default: 竹バイオマスと循環モデルで、未来をつなぐ
          - element: p
            field_name: main_content_text
            tab: main
            type: textarea
            default: 株式会社マイン（マイングループ）
      - id: section_white
        fields:
          - element: img
            field_name: section_white_image
            tab: section
            type: image
            default: ../../images/2026/04/mine-450x269.png
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: 大量消費型モデルへの危機感
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              宿泊施設向けアメニティ製品の企画・製造・販売を手がける株式会社マイン。ホテルや旅館に使い捨てのプラスチック製アメニティを供給するという、これまでのビジネスモデルに対し、同社は早くから疑問を抱いていました。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              大量生産・大量消費型の製品供給は、環境への負荷が大きく、持続可能とは言えない。このままでは、自社のビジネスそのものが将来的に立ち行かなくなるのではないか。そうした危機感が、新たな素材と循環モデルの模索へとつながりました。
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 地域資源「竹」に注目 ― 放置竹林を資源に
          - element: p
            field_name: section_white_text_3
            tab: section
            type: textarea
            default: そこで注目したのが、地域に豊富に存在する「竹」という資源でした。日本各地で放置竹林が問題になっている中、マインはこの竹をバイオマス原料として活用することを考えました。
          - element: p
            field_name: section_white_text_4
            tab: section
            type: textarea
            default: >-
              竹は成長が早く、持続的に収穫できる再生可能資源です。放置竹林の整備は地域の環境保全にもつながり、資源として活用することで新たな価値を生み出すことができます。こうして、竹バイオマスを活用したアメニティ製品の開発がスタートしました。
          - element: h2
            field_name: section_white_title_3
            tab: section
            type: text
            default: 苦労と経営判断
          - element: p
            field_name: section_white_text_5
            tab: section
            type: textarea
            default: >-
              しかし、竹素材を製品化する道のりは決して平坦ではありませんでした。竹の粉砕・加工技術、樹脂との配合比率の最適化、製品としての品質・強度の確保など、研究・試作・品質管理に膨大な時間と労力がかかりました。
          - element: p
            field_name: section_white_text_6
            tab: section
            type: textarea
            default: >-
              試行錯誤を重ねる中で、何度も壁にぶつかりましたが、経営陣は「環境に配慮した製品こそ、これからの時代に必要とされる」という信念のもと、開発投資を続けるという経営判断を下しました。
          - element: h2
            field_name: section_white_title_4
            tab: section
            type: text
            default: 賛同と販路拡大
          - element: p
            field_name: section_white_text_7
            tab: section
            type: textarea
            default: >-
              転機となったのは、2022年のプラスチック資源循環促進法の施行です。宿泊業界においても使い捨てプラスチックの削減が求められるようになり、マインの竹バイオマス製品に対する注目が一気に高まりました。
          - element: p
            field_name: section_white_text_8
            tab: section
            type: textarea
            default: >-
              単に「安い製品」ではなく、「価値で選ばれる製品」として、環境意識の高いホテル・旅館を中心に採用が進み、販路が着実に拡大。環境配慮と経済合理性を両立させた製品として、業界内で確固たるポジションを築いています。
          - element: h2
            field_name: section_white_title_5
            tab: section
            type: text
            default: 一貫生産・循環リサイクル体制
          - element: p
            field_name: section_white_text_9
            tab: section
            type: textarea
            default: マイングループの最大の特徴は、製品のライフサイクル全体をカバーする循環型ビジネスモデルを確立している点にあります。
          - element: p
            field_name: section_white_text_10
            tab: section
            type: textarea
            default: その仕組みは、販売・回収・再生・製造の4つのサイクルで構成されています。
          - element: p
            field_name: section_white_text_11
            tab: section
            type: textarea
            default: この一貫した体制により、廃棄物を最小限に抑えながら、資源の循環利用を実現しています。
          - element: h2
            field_name: section_white_title_6
            tab: section
            type: text
            default: 社員意識の向上
          - element: p
            field_name: section_white_text_12
            tab: section
            type: textarea
            default: >-
              環境配慮型のビジネスモデルへの転換は、社内にも大きな変化をもたらしました。竹バイオマス製品の開発・製造に携わることで、社員一人ひとりの環境意識が自然と高まり、日常業務においても省エネルギーや廃棄物削減への意識が浸透しています。
          - element: p
            field_name: section_white_text_13
            tab: section
            type: textarea
            default: 「自分たちの仕事が環境保全につながっている」という実感は、社員のモチベーション向上にも大きく寄与しています。
          - element: h2
            field_name: section_white_title_7
            tab: section
            type: text
            default: 今後の展望
          - element: p
            field_name: section_white_text_14
            tab: section
            type: textarea
            default: >-
              マイングループは今後、竹バイオマス技術のさらなる高度化と、製品ラインナップの拡充を進めていく方針です。アメニティ製品にとどまらず、竹素材の可能性を広げ、様々な分野での活用を模索しています。
          - element: p
            field_name: section_white_text_15
            tab: section
            type: textarea
            default: >-
              また、地域の竹林整備活動や環境教育への参画を通じて、ネイチャーポジティブの取組を社会全体に広げていくことを目指しています。地域資源を活かした循環型社会の実現に向けて、マイングループの挑戦は続きます。
