pages:
  - id: about_biodiversity
    title: 生物多様性とは？ | アーバンネイチャー北九州
    file: about/biodiversity.html
    sections:
      - id: page_header
        fields:
          - element: h1
            field_name: page_header_title
            tab: section
            type: text
            default: 生物多様性とは？
          - element: p
            field_name: page_header_text
            tab: section
            type: textarea
            default: すべての命のつながりを守り、未来へ引き継ぐために
      - id: section_white
        fields:
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: 生物多様性の重要性
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              地球上には推定870万種の生物が暮らし、互いに複雑なネットワークで結ばれています。しかし今、人類の活動によって種の絶滅が加速し、「第6の大量絶滅」が進行中と指摘されています。現在の絶滅スピードは、自然状態の約100〜1,000倍に達すると言われています。
          - element: h3
            field_name: section_white_title_2
            tab: section
            type: text
            default: 3つの多様性
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: 生物多様性は、大きく3つのレベルで捉えられます。
          - element: h3
            field_name: section_white_title_3
            tab: section
            type: text
            default: 生き物のつながり：キーストーン種
          - element: p
            field_name: section_white_text_3
            tab: section
            type: textarea
            default: >-
              生態系は複雑な「つながり」で成り立っており、特定の種が消えると連鎖的に崩壊することがあります。生態学者ロバート・ペインが行ったヒトデの除去実験では、ヒトデを取り除いただけで岩場の生き物が15種から8種に激減しました。こうした生態系を支えるカギとなる種を「キーストーン種」と呼びます。
          - element: h2
            field_name: section_white_title_4
            tab: section
            type: text
            default: 国内外の動向
          - element: p
            field_name: section_white_text_4
            tab: section
            type: textarea
            default: 生物多様性の保全に向けて、国際社会と日本では大きな制度・目標の枠組みが動き出しています。
      - id: section_gray
        fields:
          - element: h2
            field_name: section_gray_title_1
            tab: section
            type: text
            default: 生態系サービス
          - element: p
            field_name: section_gray_text_1
            tab: section
            type: textarea
            default: 私たちの暮らしは、生態系が提供するさまざまな恵み（生態系サービス）に支えられています。これらのサービスは4つのカテゴリに分類されます。
          - element: h2
            field_name: section_gray_title_2
            tab: section
            type: text
            default: 北九州市の課題
          - element: p
            field_name: section_gray_text_2
            tab: section
            type: textarea
            default: 豊かな自然を有する北九州市にも、生物多様性に関するさまざまな課題があります。
