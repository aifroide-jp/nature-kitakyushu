            default: クリエイターの方へ
          - element: h3
            field_name: persona_title_4
            tab: section
            type: text
            default: 北九州の自然を、あなたの表現に。
          - element: p
            field_name: persona_text_8
            tab: section
            type: textarea
            default: 教育・広報・制作活動に使える北九州の自然写真素材を無料で公開しています。美しい生態系の記録を、学校・行政・メディア・デザインの現場でご活用ください。
      - id: home_content
        fields:
          - element: h2
            field_name: home_content_title_1
            tab: section
            type: text
            default: アーバンネイチャー北九州 動画一覧
          - element: p
            field_name: home_content_text_1
            tab: section
            type: textarea
            default: 北九州の自然とネイチャーポジティブを映像でご覧ください
          - element: p
            field_name: home_content_text_2
            tab: section
            type: textarea
            default: お使いのブラウザは動画の再生に対応していません。テキスト版を下記よりご覧ください。
          - element: p
            field_name: home_content_text_3
            tab: section
            type: textarea
            default: アーバンネイチャー北九州
          - element: p
            field_name: home_content_text_4
            tab: section
            type: textarea
            default: >-
              北九州市は、大都市の利便性と豊かな生態系が隣接する「アーバンネイチャー」という独自の魅力を発信しています。現在、世界的に生物多様性の損失が危惧される中、市は自然を再生させるネイチャーポジティブの実現を共通目標に掲げました。その具体的な施策として、環境保全活動を支援する拠点となるネイチャーポジティブセンターを新たに設立しています。この取り組みは、貴重な野生生物を守り育むことで、都市と自然が共生する価値をさらに高めることを目的としています。北九州市は、身近にある自然の面白さを伝えるとともに、持続可能な未来に向けた積極的な姿勢を強調しています。
          - element: p
            field_name: home_content_text_5
            tab: section
            type: textarea
            default: お使いのブラウザは動画の再生に対応していません。テキスト版を下記よりご覧ください。
          - element: p
            field_name: home_content_text_6
            tab: section
            type: textarea
            default: 北九州ネイチャーポジティブセンター PR動画：屋内施設編
          - element: p
            field_name: home_content_text_7
            tab: section
            type: textarea
            default: 制作：北九州市立大学映像制作集団 ROMANDOM
          - element: p
            field_name: home_content_text_8
            tab: section
            type: textarea
            default: >-
              北九州市は、自然環境の回復と経済活動を両立させるネイチャーポジティブを推進しており、その理念を学べる多様な屋内施設を紹介しています。いのちのたび博物館では生命の進化の歴史を辿ることができ、北九州市ほたる館や香月・黒川ほたる館では水辺の生態系の美しさや命の尊さを肌で感じられます。また、環境ミュージアムは過去の公害克服の歴史から未来へのヒントを提示し、水環境館では再生された河川の現状をリアルタイムで観察できる場となっています。これらの拠点を巡ることで、市民は都市と自然が共生する「アーバンネイチャー」の魅力を再発見し、環境保護の重要性を理解できます。最終的にこの動画は、一人ひとりが楽しみながら行動を起こすことで、次世代へ豊かな自然を繋いでいく大切さを呼びかけています。
          - element: p
            field_name: home_content_text_9
            tab: section
            type: textarea
            default: Kitakyushu — The City of Altruism and Regeneration
          - element: p
            field_name: home_content_text_10
            tab: section
            type: textarea
            default: 『利他』と『再生』のまち、北九州市
          - element: p
            field_name: home_content_text_11
            tab: section
            type: textarea
            default: >-
              Once known as "the city of pollution," Kitakyushu has transformed itself through the
              united efforts of its citizens, businesses, and government. Today, it stands as one of
              the world's leading sustainable cities.
          - element: p
            field_name: home_content_text_12
            tab: section
            type: textarea
            default: >-
              From offshore wind power along its coast, to Eco-Town—the hub of resource recycling,
              to urban nature where people and the environment coexist in harmony. Here, the spirit
              of altruism and regeneration thrives in everyday life.
          - element: p
            field_name: home_content_text_13
            tab: section
            type: textarea
            default: >-
              Kitakyushu — a city that overcame its past and creates the future. Discover the story
              of its "Deep Sustainability."
          - element: p
            field_name: home_content_text_14
            tab: section
            type: textarea
            default: かつて"公害の街"と呼ばれた北九州市。しかし、市民・企業・行政が手を取り合い、それを克服したこの街は、いまや世界でもトップクラスのサステナブルシティへと生まれ変わりました。
          - element: p
            field_name: home_content_text_15
            tab: section
            type: textarea
            default: 沿岸に広がる洋上風力、資源循環の拠点であるエコタウン、人と自然が寄り添うアーバンネイチャー。そして、"利他"と"再生"の心が、市民の暮らしの中に息づいています。
          - element: p
            field_name: home_content_text_16
            tab: section
            type: textarea
            default: 北九州－それは、過去を乗り越え、未来をつくる力。ぜひこのまちの"ディープ・サステナビリティ"の物語に触れてください。
          - element: h2
            field_name: home_content_title_2
            tab: section
            type: text
            default: 北九州市の自然スポット
          - element: p
            field_name: home_content_text_17
