          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              北九州市ネイチャーポジティブセンター（NPセンター）は、北九州市が「北九州市生物多様性戦略
              2025-2030」に基づいて認定した自然体験・環境学習施設のネットワークです。市内10か所の拠点が連携し、市民が身近な自然に触れ、学び、行動するための公式プラットフォームを形成しています。
          - element: p
            field_name: section_white_text_3
            tab: section
            type: textarea
            default: 各施設はそれぞれ独自の特色を持ち、環境ミュージアムでの学習体験、ビオトープでの自然観察、動物園での生物多様性の理解など、多様なプログラムを提供しています。
          - element: p
            field_name: section_white_text_4
            tab: section
            type: textarea
            default: >-
              事務局はIGES北九州アーバンセンターが務め、各施設間の連携やイベントの共同企画、情報発信を行っています。10の拠点施設を巡ることで、北九州の豊かな自然環境を多角的に体験できます。
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 拠点マップ
          - element: p
            field_name: section_white_text_5
