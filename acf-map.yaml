  - id: about_spots_biotope
    title: 響灘ビオトープ | アーバンネイチャー北九州
    file: about/spots/biotope.html
    sections:
      - id: header
        fields:
          - element: img
            field_name: header_image
            tab: section
            type: image
            default: ../../images/2026/02/logo.png
      - id: spot_hero
        fields:
          - element: img
            field_name: spot_hero_image
            tab: main
            type: image
            default: ../../images/2025/03/biotope.jpg
          - element: h1
            field_name: spot_hero_title
            tab: main
            type: text
            default: 響灘ビオトープ
          - element: p
            field_name: spot_hero_text
            tab: main
            type: textarea
            default: 廃棄物処分場跡地が蘇った、日本最大級の湿地型ビオトープ
      - id: section_white
        fields:
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: 見どころ・体験できること
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              かつて廃棄物の最終処分場だった土地が、40年の歳月をかけて41haの豊かな湿地へと生まれ変わりました。環境再生の奇跡とも呼ばれるこの場所では、絶滅危惧種のチュウヒやベッコウトンボを含む約800種の動植物が生息しています。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              整備された木道や観察デッキから、水生昆虫・草花・野鳥をじっくり観察できます。見晴らし台からはビオトープ全体を見渡せ、四季それぞれの表情が楽しめます。ネイチャーセンターの展示も充実しており、お子さんと一緒の自然学習にも最適です。
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 地図・場所
