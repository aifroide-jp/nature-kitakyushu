  - id: network_cases_nature
    title: 株式会社ネイチャー | 実践事例 | アーバンネイチャー北九州
    file: network/cases/nature.html
    sections:
      - id: header
        fields:
          - element: img
            field_name: header_image
            tab: section
            type: image
            default: ../../images/2026/02/logo.png
      - id: main_content
        fields:
          - element: h1
            field_name: main_content_title
            tab: main
            type: text
            default: 環境への貢献と地域活性化を育む「企業体験農園」の可能性
          - element: p
            field_name: main_content_text
            tab: main
            type: textarea
            default: 株式会社ネイチャー × イオン九州株式会社
      - id: section_white
        fields:
          - element: img
            field_name: section_white_image_1
            tab: section
            type: image
            default: ../../images/2026/05/nature-450x269.jpg
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: 「ありがとうが増える場所」づくり
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              株式会社ネイチャーは、トマトの生産・販売を軸に、15年以上にわたり体験農園を運営してきた農業生産法人です。「ありがとうが増える場所」という理念のもと、地域住民や企業と連携しながら、自然と共生する持続可能な社会の実現に取り組んでいます。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              同社の農場は、単なる生産の場ではなく、「豊かさの原点」や「多様性を育む空間」として位置づけられています。参加者は、土の匂いや風の強さ、虫の声などを五感で感じながら自然と向き合い、AIやSNSでは得られない"一次情報"の価値を体感します。こうした体験は、心身のリフレッシュやストレス軽減につながり、人生の満足度を高める機会としても評価されています。
          - element: img
            field_name: section_white_image_2
            tab: section
            type: image
            default: ../../images/2026/05/nature-amano.jpg
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 主な取り組み
          - element: h3
            field_name: section_white_title_3
            tab: section
            type: text
            default: ①和炭栽培の推進
          - element: p
            field_name: section_white_text_3
            tab: section
            type: textarea
            default: 木炭を活用した土壌改良により、病害虫に強い作物づくりを実践。約15品目において、有機肥料・有機農薬を用いた栽培管理を行っています。
          - element: h3
            field_name: section_white_title_4
            tab: section
            type: text
            default: ②食品残渣リサイクル事業指定農園
          - element: p
            field_name: section_white_text_4
            tab: section
            type: textarea
            default: >-
              市内の飲食店やスーパーから出る食品残渣を回収し、堆肥化して農園で活用。このリサイクル肥料を活用した農園は、事業参加企業グループでも利用されています。廃棄物の削減と土壌の豊かさを同時に実現する循環型モデルです。
          - element: h3
            field_name: section_white_title_5
            tab: section
            type: text
            default: ③農園サポーターコミュニティの運営
          - element: p
            field_name: section_white_text_5
            tab: section
            type: textarea
            default: 地域住民を巻き込んだボランティア参加による共生型農園を運営。企業会員・団体会員の募集も開始し、ネイチャーポジティブ経営に資する活動の場を創出しています。
          - element: h3
            field_name: section_white_title_6
            tab: section
            type: text
            default: ④農産物加工と販売イベントによる付加価値創出
          - element: p
            field_name: section_white_text_6
            tab: section
            type: textarea
            default: 収穫した野菜を活用した加工品（カレー、ペースト、ジャム等）を商品化。収穫期には農業イベントを開催し、参加者の交流機会を生み出しています。
          - element: h2
            field_name: section_white_title_7
            tab: section
            type: text
            default: 協創実践事例：株式会社ネイチャー × イオン九州株式会社
          - element: p
            field_name: section_white_text_7
            tab: section
            type: textarea
            default: >-
              地域社会への貢献と、企業のネイチャーポジティブな取り組みの具現化を目指し、株式会社ネイチャーの体験農園が、イオン九州株式会社の小中学生体験学習プログラム「イオンチアーズクラブ」の指定農園として認定されました。次世代を担う子どもたちに農業体験を通じて自然との共生を促し、食育にも貢献することを目的とした協創プロジェクトです。
          - element: p
            field_name: section_white_text_8
            tab: section
            type: textarea
            default: >-
              2025年度には、ジャガイモの植え付けから収穫までを一貫して体験する試験的な取り組みを実施。子どもたちは自ら土に触れ、作物の成長を見守り、収穫したジャガイモをその場で調理して食べるという貴重な経験をしました。この一連の体験は、参加した子どもたちや保護者から非常に高い評価を受け、次年度に向けてはさらに内容を充実させる予定です。
          - element: img
            field_name: section_white_image_3
            tab: section
            type: image
            default: ../../images/2026/05/nature-kids1.jpg
          - element: img
            field_name: section_white_image_4
            tab: section
            type: image
            default: ../../images/2026/05/nature-kids2.jpg
          - element: img
            field_name: section_white_image_5
            tab: section
            type: image
            default: ../../images/2026/05/nature-harvest.jpg
          - element: p
            field_name: section_white_text_9
            tab: section
            type: textarea
            default: >-
              本プロジェクトの成果は、子どもたちが体験を通して得た学びや気づきをレポートにまとめ、令和7年12月に開催されたイオン福津店での対話型環境イベントで発表されました。子どもたち自身の言葉で語られた気づきは、自然や農業に対する新たな価値観を創出し、次世代へ自然と共生する大切さを伝える貴重な機会となりました。
          - element: img
            field_name: section_white_image_6
            tab: section
            type: image
            default: ../../images/2026/05/nature-cooking.jpg
          - element: img
            field_name: section_white_image_7
            tab: section
            type: image
            default: ../../images/2026/05/nature-potato.jpg
          - element: h2
            field_name: section_white_title_8
            tab: section
            type: text
            default: 本事例が示すネイチャーポジティブへの貢献
          - element: p
            field_name: section_white_text_10
            tab: section
            type: textarea
            default: >-
              本事例は、企業が農業体験を通じて地域や自然と関わりながら、教育機会の創出や心身のリフレッシュを実現する好事例です。企業活動と社会・環境貢献を無理なく結びつけることで、地域との信頼関係の構築や、持続可能な取組の広がりにつながる可能性を示しています。
          - element: h2
            field_name: section_white_title_9
            tab: section
            type: text
            default: 今後の展望　～パートナー企業募集～
          - element: p
            field_name: section_white_text_11
            tab: section
            type: textarea
            default: >-
              株式会社ネイチャーでは、これまで培ってきた体験農園のノウハウを活かし、今後も地域や企業と連携した取り組みを継続・発展させていく予定です。体験農園という場を通じて、多様な立場の人々が自然と関わり、学び合う機会が広がることが期待されています。
          - element: p
            field_name: section_white_text_12
            tab: section
            type: textarea
            default: 本ネットワークとしても、こうした実践事例を共有することで、ネイチャーポジティブな取り組みが地域全体へ波及していくことを目指しています。
          - element: p
            field_name: section_white_text_13
            tab: section
            type: textarea
            default: ※取り組みに関心をお持ちの企業・団体の方は、北九州ネイチャーポジティブネットワーク事務局までお問い合わせください。
