  - id: about_spots_sone_higata
    title: 曽根干潟 | アーバンネイチャー北九州
    file: about/spots/sone-higata.html
    sections:
      - id: header
        fields:
          - element: img
            field_name: header_image
            tab: section
            type: image
            default: ../../images/2026/02/logo.png
      - id: spot_hero
        fields:
          - element: img
            field_name: spot_hero_image
            tab: main
            type: image
            default: ../../images/2025/03/sone-higata.jpg
          - element: h1
            field_name: spot_hero_title
            tab: main
            type: text
            default: 曽根干潟
          - element: p
            field_name: spot_hero_text
            tab: main
            type: textarea
            default: カブトガニが産卵し、100種を超える野鳥が舞う、周防灘最大の干潟
      - id: section_white
        fields:
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: 見どころ・体験できること
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              干潮時には沖合5kmまで広大な砂州が現れ、条件次第では「間島」まで歩いて渡れる、周防灘きっての干潟です。昔からアサリや牡蠣の好漁場として地域の暮らしを支えてきた豊かな海の恵みが、今も変わらず息づいています。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              世界的にも希少な絶滅危惧種「ズグロカモメ」の越冬地として知られ、これまで100種以上の野鳥が確認されています。隣接する「カブトガニ自慢館」では年間を通じてカブトガニを観察でき、7〜8月には産卵の瞬間に立ち会える貴重な体験も。双眼鏡を持って干潟をのんびり歩くだけで、都市のそばとは思えない豊かな生き物の世界に出合えます。
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 地図・場所
