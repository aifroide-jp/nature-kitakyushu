              北九州市最大の二級河川・紫川は、かつて水質悪化に悩まされた時代を乗り越え、地道な環境改善の取り組みによってアユやホタルが戻ってきた「再生の川」です。市街地を流れながら豊かな自然を感じられるのが最大の魅力です。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: >-
              デザイン性豊かな個性的な10本の橋を巡る「紫川10橋めぐり」が人気で、川沿いの整備された遊歩道はウォーキング・サイクリングに最適。無料で入館できる「水環境館」では、川の仕組みや生き物を楽しく学べる展示が充実しています。春の桜並木も必見です。
          - element: h2
            field_name: section_white_title_2
            tab: section
            type: text
            default: 地図・場所
