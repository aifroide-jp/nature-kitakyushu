  - id: nature_symbiosis
    title: 自然共生サイト | アーバンネイチャー北九州
    file: nature-symbiosis/index.html
    sections:
      - id: main_content
        fields:
          - element: h1
            field_name: main_content_title
            tab: main
            type: text
            default: 自然共生サイト
          - element: p
            field_name: main_content_text
            tab: main
            type: textarea
            default: 環境省認定「自然共生サイト」と北九州市の取り組み
      - id: section_white
        fields:
          - element: h2
            field_name: section_white_title_1
            tab: section
            type: text
            default: 自然共生サイトとは
          - element: p
            field_name: section_white_text_1
            tab: section
            type: textarea
            default: >-
              「自然共生サイト」とは、環境省が認定する制度で、民間の取組等によって生物多様性の保全が図られている区域を認定するものです。自然保護区域（保護地域）以外で、企業の森、里地里山、都市の緑地など、多様な主体による生物多様性保全の取り組みが行われている場所が対象となります。
          - element: p
            field_name: section_white_text_2
            tab: section
            type: textarea
            default: 認定されたサイトは、国際的な目標である「30by30」の達成に貢献する区域として、国の保全区域データベース（OECM）に登録されます。
          - element: h3
            field_name: section_white_title_2
            tab: section
            type: text
            default: 30by30（サーティ・バイ・サーティ）目標
          - element: p
            field_name: section_white_text_3
            tab: section
            type: textarea
            default: >-
              2022年12月に採択された「昆明・モントリオール生物多様性枠組」における主要目標の一つで、2030年までに陸と海の30%以上を健全な生態系として効果的に保全しようとする国際的な目標です。日本政府もこの達成に向け、自然共生サイト制度を推進しています。
          - element: p
            field_name: section_white_text_4
            tab: section
            type: textarea
            default: 2030年までの保全目標
          - element: p
            field_name: section_white_text_5
            tab: section
            type: textarea
            default: 陸域と海域それぞれ30%以上を保全区域とする国際目標
          - element: p
            field_name: section_white_text_6
            tab: section
            type: textarea
            default: 認定サイト数（全国）
          - element: p
            field_name: section_white_text_7
            tab: section
            type: textarea
            default: 2025年度までに全国で認定された自然共生サイトの数
          - element: p
            field_name: section_white_text_8
            tab: section
            type: textarea
            default: 北九州市内のサイト
          - element: p
            field_name: section_white_text_9
            tab: section
            type: textarea
            default: 北九州市内で認定を受けた自然共生サイトの数
          - element: h2
            field_name: section_white_title_3
            tab: section
            type: text
            default: 北九州市と自然共生サイト
          - element: p
            field_name: section_white_text_10
            tab: section
            type: textarea
            default: >-
              北九州市は、響灘ビオトープをはじめとする豊かな自然環境を有し、都市と自然が共存するまちづくりを進めています。市内には、干潟、カルスト台地、里山、都市緑地など多様な生態系が存在し、これらの保全と活用が自然共生サイト認定を通じて推進されています。
          - element: p
            field_name: section_white_text_11
            tab: section
            type: textarea
            default: アーバンネイチャー北九州は、これらの自然共生サイトの保全活動を支援し、地域住民・企業・行政が一体となった取り組みを推進するプラットフォームとして機能しています。
          - element: h2
            field_name: section_white_title_4
            tab: section
            type: text
            default: 認定サイト一覧
          - element: p
            field_name: section_white_text_12
            tab: section
            type: textarea
            default: 北九州市内の自然共生サイト情報を準備中です
          - element: p
            field_name: section_white_text_13
            tab: section
            type: textarea
            default: 認定サイトの詳細情報は順次掲載いたします
          - element: h2
            field_name: section_white_title_5
            tab: section
            type: text
            default: 認定に向けた取り組み
          - element: h3
            field_name: section_white_title_6
            tab: section
            type: text
            default: 申請支援
          - element: p
            field_name: section_white_text_14
            tab: section
            type: textarea
            default: 自然共生サイトの認定を目指す団体・企業に対して、申請プロセスの支援やアドバイスを提供しています。認定基準の確認から書類作成まで、一貫したサポートを行います。
          - element: h3
            field_name: section_white_title_7
            tab: section
            type: text
            default: モニタリング
          - element: p
            field_name: section_white_text_15
            tab: section
            type: textarea
            default: 認定後のサイトにおける生物多様性のモニタリング調査を支援し、継続的な保全活動の質の向上を図ります。
          - element: h3
            field_name: section_white_title_8
            tab: section
            type: text
            default: ネットワーク形成
          - element: p
            field_name: section_white_text_16
            tab: section
            type: textarea
            default: 認定サイト間の連携や情報共有を促進し、広域的な生態系ネットワークの構築を目指しています。
          - element: h3
            field_name: section_white_title_9
            tab: section
            type: text
            default: 普及啓発
          - element: p
            field_name: section_white_text_17
            tab: section
            type: textarea
            default: 自然共生サイト制度の意義や、北九州の生物多様性の価値について、市民向けのイベントや講座を通じて普及啓発を行っています。
